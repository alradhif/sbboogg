<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5FB">
<title>ورشة نموذج العمل التجاري</title>
<link rel="preload" href="assets/fonts/alexandria-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/noto-sans-arabic-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Alexandria";font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/alexandria-arabic-wght-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Alexandria";font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/alexandria-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Sans Arabic";font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/noto-sans-arabic-arabic-wght-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Noto Sans Arabic";font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/noto-sans-arabic-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#F5F5FB; --paper:#FFFFFF; --ink:#1B1D45; --ink-2:#565A82; --ink-3:#9A9DBA; --rule:#E4E5F0; --rule-2:#D3D5E4;
  /* Five harmonised hues: equal weight, evenly spaced around the wheel */
  --indigo:#5B6CFF; --indigo-bg:#E8EBFF; --indigo-tint:#F6F7FF; --indigo-ink:#3442C6;
  --pink:#EC4F8C;   --pink-bg:#FDE4EE;   --pink-tint:#FFF6F9;   --pink-ink:#B3245D;
  --amber:#F4A42A;  --amber-bg:#FEF0D3;  --amber-tint:#FFFBF2;  --amber-ink:#8E5D08;
  --teal:#14B39A;   --teal-bg:#D4F4EE;   --teal-tint:#F2FCFA;   --teal-ink:#0A7766;
  --coral:#F2665B;  --coral-bg:#FDE5E2;  --coral-tint:#FFF7F6;  --coral-ink:#B03A30;
  --display:"Alexandria",system-ui,sans-serif; --body:"Noto Sans Arabic","Alexandria",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:10px}
.shell{max-width:1240px;margin:0 auto;padding:0 24px}
svg{display:block}

/* Hue classes — every coloured element reads its colour from these */
.h-indigo{--c:var(--indigo);--cbg:var(--indigo-bg);--ctint:var(--indigo-tint);--cink:var(--indigo-ink)}
.h-pink{--c:var(--pink);--cbg:var(--pink-bg);--ctint:var(--pink-tint);--cink:var(--pink-ink)}
.h-amber{--c:var(--amber);--cbg:var(--amber-bg);--ctint:var(--amber-tint);--cink:var(--amber-ink)}
.h-teal{--c:var(--teal);--cbg:var(--teal-bg);--ctint:var(--teal-tint);--cink:var(--teal-ink)}
.h-coral{--c:var(--coral);--cbg:var(--coral-bg);--ctint:var(--coral-tint);--cink:var(--coral-ink)}

/* ---------- Mini canvas ---------- */
.mini{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:1fr 1fr .8fr;gap:2px;direction:ltr;
  grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "cost cost cost cost cost rev rev rev rev rev"}
.mini i{border-radius:3px;background:#E7E8F2;transition:background .4s var(--ease)}
.mini i.on{background:var(--c)}
.a-kp{grid-area:kp}.a-ka{grid-area:ka}.a-kr{grid-area:kr}.a-vp{grid-area:vp}.a-cr{grid-area:cr}.a-ch{grid-area:ch}.a-cs{grid-area:cs}.a-cost{grid-area:cost}.a-rev{grid-area:rev}
.mini.logo{width:34px;height:24px;gap:1.5px}
.mini.logo i{background:var(--c);border-radius:2px}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:15px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);padding:5px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.live.ok i{background:var(--teal);animation:pulse 2.4s ease-in-out infinite}
.live.err i{background:var(--coral)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(20,179,154,.4)}50%{box-shadow:0 0 0 5px rgba(20,179,154,0)}}

/* ---------- Home: hero ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:24px 0 40px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,5.2vw,64px);line-height:1.08;margin:0 0 16px;letter-spacing:-.5px}
.hero p{margin:0 0 24px;color:var(--ink-2);font-size:17.5px;max-width:42ch}
.hero-steps{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.hero-steps li{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:99px;padding:6px 14px 6px 8px;font-size:14px;font-weight:500}
.hero-steps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;color:#fff;background:var(--c)}

.showcase{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:28px;padding:22px;box-shadow:0 30px 60px -40px rgba(27,29,69,.35)}
.show-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.show-head strong{font-family:var(--display);color:var(--ink);font-size:15px}
.big-canvas{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:118px 118px 92px;gap:8px;direction:ltr;
  grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "cost cost cost cost cost rev rev rev rev rev"}
.bc{position:relative;direction:rtl;border-radius:14px;background:var(--ctint);border:1.5px solid var(--cbg);padding:9px;display:flex;flex-direction:column;gap:5px;overflow:hidden;cursor:default;transition:transform .25s var(--ease),border-color .25s}
.bc:hover{transform:translateY(-3px);border-color:var(--c)}
.bc-top{display:flex;align-items:center;gap:6px}
.bc-no{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.bc-name{font-family:var(--display);font-size:11.5px;font-weight:600;color:var(--cink);line-height:1.3}
.bc span.bar-n{display:block;height:9px;border-radius:4px;background:var(--cbg);transform-origin:right;animation:grow .6s var(--ease) both}
.bc span.bar-n:nth-of-type(2){width:72%}.bc span.bar-n:nth-of-type(3){width:48%}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.bc{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.show-foot{margin-top:14px;font-size:13px;color:var(--ink-2)}

/* ---------- Home: rooms ---------- */
.rooms-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.rooms-head h2{font-family:var(--display);font-size:24px;margin:0}
.rooms-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--rule-2);background:var(--paper);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink-2);transition:all .15s}
.filters button b{font-family:var(--display);font-weight:600;margin-inline-start:4px;color:var(--ink-3)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button[aria-pressed="true"] b{color:rgba(255,255,255,.7)}

.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding-bottom:56px}
.room{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--paper);border:1.5px solid var(--rule);border-radius:20px;text-decoration:none;
  transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.room:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 18px 30px -22px var(--c)}
.room:active{transform:scale(.98)}
.room-top{display:flex;justify-content:space-between;align-items:center}
.room-no{width:52px;height:52px;border-radius:15px;background:var(--cbg);color:var(--cink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;transition:background .2s,color .2s}
.room:hover .room-no{background:var(--c);color:#fff}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:#F0F0F7;color:var(--ink-3)}
.pill.started{background:var(--cbg);color:var(--cink)}
.pill.done{background:var(--teal);color:#fff;display:inline-flex;align-items:center;gap:4px}
.pill.done svg{width:12px;height:12px}
.room-label{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.3}
.room-name{font-family:var(--display);font-weight:600;font-size:16px;margin:3px 0 0;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-name.empty{color:var(--ink-3);font-weight:400;font-family:var(--body);font-size:15px}
.room .mini{height:44px}
.room .mini i.on{background:var(--mc)}
.room-meter{height:4px;border-radius:4px;background:#EEEFF6;overflow:hidden}
.room-meter i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s var(--ease)}
.loading .room{pointer-events:none}
.loading .room-name{color:transparent;background:#EEF0F6;border-radius:6px;width:70%}
.no-match{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:40px 0}

/* ---------- Room view ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(245,245,251,.88);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.bar-in{display:flex;align-items:center;gap:14px;min-height:70px}
.back{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--rule-2);background:var(--paper);font-size:14px;font-weight:500;flex-shrink:0;transition:border-color .15s}
.back:hover{border-color:var(--ink)}
.back svg{width:18px;height:18px}
.bar-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.bar-no{font-family:var(--display);font-weight:800;font-size:17px;color:#fff;background:var(--c);border-radius:12px;min-width:42px;height:42px;display:grid;place-items:center;padding:0 8px;flex-shrink:0}
.bar-text{min-width:0}
.bar-text strong{display:block;font-family:var(--display);font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.status{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.status.dirty i{background:var(--amber)}
.status.editing i{background:var(--indigo)}
.ring{position:relative;width:46px;height:46px;flex-shrink:0}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:#E6E7F1}
.ring .val{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:700}
.acts{display:flex;gap:8px;flex-shrink:0}
.btn{height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#2C2F66}
.btn-go{background:var(--teal);color:#fff;box-shadow:0 10px 20px -12px var(--teal)}
.btn-go:hover{background:#0FA08A}
.btn-line{background:var(--paper);border:1px solid var(--rule-2)}
.btn-line:hover{border-color:var(--ink)}
.btn-pdf{background:var(--paper);border:1px solid var(--rule-2);color:var(--ink)}
.btn-pdf:hover{border-color:var(--coral);color:var(--coral-ink)}
.btn[disabled]{opacity:.6;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .7s linear infinite;opacity:.8}
@keyframes sp{to{transform:rotate(360deg)}}

.nav9{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav9::-webkit-scrollbar{display:none}
.nav9 button{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500;transition:border-color .15s,background .15s}
.nav9 button:hover{border-color:var(--c)}
.nav9 i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:11px;font-weight:700;background:var(--cbg);color:var(--cink)}
.nav9 button.has i{background:var(--c);color:#fff}
.nav9 small{font-family:var(--display);color:var(--ink-3);font-size:12px}

.room-intro{padding:28px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.name-wrap{flex:1;min-width:280px;max-width:680px}
.name-wrap label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:2px}
.name-input{width:100%;border:0;border-bottom:2px solid var(--rule-2);background:transparent;padding:6px 0 8px;font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,40px);line-height:1.3;border-radius:0}
.name-input:focus{outline:none;border-bottom-color:var(--c)}
.name-input::placeholder{color:var(--ink-3);font-weight:500}
.name-input[readonly]{border-bottom-color:transparent}
.intro-side{display:flex;gap:10px;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;font-size:14px;color:var(--ink-2)}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--rule-2);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"] .sw{background:var(--indigo)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(-14px)}

.done-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin:0 0 16px;padding:16px 20px;border-radius:18px;color:#fff;
  background:linear-gradient(120deg,var(--indigo) 0%,var(--pink) 50%,var(--amber) 100%)}
.done-banner b{font-family:var(--display);font-size:18px;display:block}
.done-banner span{font-size:14px;opacity:.92}
.done-banner .btn{background:#fff;color:var(--ink)}

/* Board — one ruled surface, like the printed canvas */
.board{direction:ltr;display:grid;gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);border-radius:24px;overflow:hidden;margin-bottom:120px;
  grid-template-columns:repeat(10,minmax(0,1fr));
  grid-template-rows:minmax(280px,auto) minmax(280px,auto) minmax(210px,auto);
  grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "cost cost cost cost cost rev rev rev rev rev"}
.cell{direction:rtl;background:var(--ctint);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:150px;transition:box-shadow .3s}
.cell.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 0 var(--c)}25%{box-shadow:inset 0 0 0 3px var(--c)}}
.c-head{display:flex;align-items:flex-start;gap:10px}
.c-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--c);color:#fff}
.c-ic svg{width:19px;height:19px}
.c-t{flex:1;min-width:0}
.c-t h3{margin:0;font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.35}
.c-t small{display:block;font-size:11.5px;color:var(--ink-3);direction:ltr;text-align:right;line-height:1.4}
.c-step{font-family:var(--display);font-size:11px;font-weight:700;color:var(--cink);background:var(--cbg);border-radius:99px;padding:2px 8px;white-space:nowrap}
.c-q{margin:0;font-size:13px;color:var(--ink-2);line-height:1.65}
.hints-off .c-q,.hints-off .ex-btn{display:none}
.ex-btn{align-self:flex-start;background:none;border:0;padding:0;font-size:12.5px;font-weight:600;color:var(--cink);display:inline-flex;align-items:center;gap:5px}
.ex-btn svg{width:14px;height:14px}
.ex{display:none;flex-direction:column;gap:5px;padding:10px;border:1.5px dashed var(--cbg);border-radius:10px;background:rgba(255,255,255,.6)}
.cell.show-ex .ex{display:flex}
.ex small{font-size:11.5px;color:var(--ink-3)}
.ex span{font-size:13px;color:var(--ink-2)}
.ex span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-inline-end:7px;vertical-align:middle;opacity:.6}

.notes{display:flex;flex-direction:column;gap:6px;flex:1}
.note{position:relative;background:var(--paper);border:1px solid var(--cbg);border-radius:10px;padding:8px 12px 8px 12px;font-size:14.5px;line-height:1.6;word-break:break-word;box-shadow:0 1px 0 var(--cbg)}
.note::before{content:"";position:absolute;inset-block:9px;right:0;width:3px;border-radius:3px 0 0 3px;background:var(--c)}
.note.pop{animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.empty-cta{flex:1;min-height:70px;border:1.5px dashed var(--cbg);border-radius:12px;background:transparent;color:var(--cink);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
.empty-cta:hover{background:var(--paper);border-color:var(--c)}
.empty-cta svg{width:16px;height:16px}
.note.ed{display:flex;align-items:flex-start;gap:2px;padding:2px 4px 2px 2px}
.note.ed textarea{flex:1;border:0;background:transparent;resize:none;padding:6px 10px;line-height:1.6;font-size:14.5px;min-height:36px;overflow:hidden;border-radius:8px}
.note.ed textarea:focus{outline:none;background:var(--ctint)}
.rm{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:var(--ink-3);display:grid;place-items:center;flex-shrink:0;margin-top:3px}
.rm:hover{color:var(--coral-ink);background:var(--coral-bg)}
.rm svg{width:15px;height:15px}
.adder{display:flex;gap:6px;align-items:flex-end;margin-top:2px}
.adder textarea{flex:1;border:1.5px dashed var(--rule-2);border-radius:10px;background:rgba(255,255,255,.75);padding:8px 10px;resize:none;min-height:40px;line-height:1.55;font-size:14.5px;overflow:hidden;transition:border-color .15s,background .15s}
.adder textarea:focus{outline:none;border-style:solid;border-color:var(--c);background:#fff}
.adder button{width:40px;height:40px;border-radius:10px;border:0;background:var(--c);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .1s}
.adder button:active{transform:scale(.92)}
.adder button svg{width:18px;height:18px}

.pager{display:flex;justify-content:space-between;gap:12px;margin:-90px 0 48px}
.pager button{background:none;border:0;padding:8px 0;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.pager button:hover{color:var(--ink)}
.pager svg{width:16px;height:16px}
.mbar{display:none}

/* ---------- Toast, dialogs, celebration ---------- */
.toast{position:fixed;inset-inline:0;bottom:24px;margin:0 auto;width:max-content;max-width:calc(100vw - 28px);z-index:200;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px 12px 14px;box-shadow:0 24px 48px -16px rgba(27,29,69,.5);
  opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .2s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:none}
.t-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal);flex-shrink:0}
.toast.err .t-ic{background:var(--coral)}
.toast.busy .t-ic{background:var(--indigo)}
.t-ic svg{width:17px;height:17px}
.toast b{display:block;font-weight:600;font-size:15px}
.toast small{display:block;font-size:13px;opacity:.75}

.dlg-bg{position:fixed;inset:0;z-index:150;background:rgba(27,29,69,.42);display:none;align-items:flex-end;justify-content:center;padding:16px}
.dlg-bg.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{position:relative;background:var(--paper);border-radius:24px;padding:26px;width:100%;max-width:440px;margin-bottom:max(16px,env(safe-area-inset-bottom));animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (min-width:721px){.dlg-bg{align-items:center}}
.dlg h2{font-family:var(--display);font-size:21px;margin:0 0 6px}
.dlg p{margin:0 0 20px;color:var(--ink-2)}
.dlg-acts{display:flex;flex-direction:column;gap:8px}
.dlg-acts .btn{width:100%;height:48px}
.celebrate .dlg{text-align:center;overflow:hidden}
.celebrate .medal{width:84px;height:84px;margin:4px auto 14px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--indigo),var(--pink) 55%,var(--amber));color:#fff;animation:spinIn .7s var(--ease)}
.celebrate .medal svg{width:42px;height:42px}
@keyframes spinIn{from{transform:rotate(-30deg) scale(.4);opacity:0}}
.celebrate .mini{width:180px;height:70px;margin:0 auto 16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:160}

.alert{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--coral-bg);color:var(--coral-ink);font-size:14px}

/* ---------- PDF sheet (rendered off-screen, A4 landscape @150dpi) ---------- */
.sheet{position:fixed;top:0;left:-30000px;width:1754px;height:1240px;background:#fff;padding:56px 60px 44px;display:flex;flex-direction:column;gap:26px;font-family:var(--body);color:var(--ink);direction:rtl;--fs:16px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.sh-kicker{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink-2)}
.sh-kicker .mini{width:46px;height:32px}
.sh-title{font-family:var(--display);font-size:54px;font-weight:800;line-height:1.15;margin:10px 0 0;max-width:1150px}
.sh-meta{text-align:left;direction:rtl;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sh-no{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;background:var(--ink);border-radius:14px;padding:8px 18px}
.sh-date{font-size:18px;color:var(--ink-2)}
.sh-board{flex:1;min-height:0;direction:ltr;display:grid;gap:2px;background:var(--rule-2);border:2px solid var(--rule-2);border-radius:26px;overflow:hidden;
  grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:1fr 1fr .78fr;
  grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "cost cost cost cost cost rev rev rev rev rev"}
.sh-cell{direction:rtl;background:var(--ctint);padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.sh-ch{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--cbg);padding-bottom:10px}
.sh-ic{width:38px;height:38px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;flex-shrink:0}
.sh-ic svg{width:21px;height:21px}
.sh-ch h3{margin:0;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.3}
.sh-ch small{display:block;font-size:13px;color:var(--ink-3);direction:ltr;text-align:right;line-height:1.3}
.sh-notes{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:7px}
.sh-cell.wide .sh-notes{display:grid;grid-template-columns:1fr 1fr;align-content:start;column-gap:10px}
.sh-note{position:relative;background:#fff;border:1.5px solid var(--cbg);border-radius:10px;padding:7px 14px 7px 10px;font-size:var(--fs);line-height:1.55;word-break:break-word}
.sh-note::before{content:"";position:absolute;top:9px;bottom:9px;right:0;width:4px;border-radius:4px 0 0 4px;background:var(--c)}
.sh-empty{font-size:15px;color:var(--ink-3)}
.sh-foot{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--ink-2)}
.sh-foot b{font-family:var(--display);color:var(--ink)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .rooms{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{grid-template-columns:1fr;gap:28px}
  .board{direction:rtl;grid-template-columns:1fr 1fr;grid-template-rows:none;grid-template-areas:none}
  .cell{grid-area:auto!important;order:var(--o)}
  .cell.a-cost{grid-column:1/-1}
}
@media (max-width:720px){
  .shell{padding:0 16px}
  body{font-size:15px}
  .top{padding:14px 0}
  .hero{padding:8px 0 28px}
  .hero p{font-size:15.5px;margin-bottom:18px}
  .showcase{padding:14px;border-radius:22px;order:-1}
  .big-canvas{grid-template-rows:74px 74px 58px;gap:5px}
  .bc{padding:6px;border-radius:10px}
  .bc-name{display:none}
  .bc-no{width:18px;height:18px;font-size:10px}
  .bc span.bar-n{height:6px}
  .bc span.bar-n:nth-of-type(3){display:none}
  .rooms{grid-template-columns:1fr 1fr;gap:10px}
  .room{padding:12px;border-radius:18px;gap:10px}
  .room-no{width:44px;height:44px;font-size:20px;border-radius:13px}
  .room-name{font-size:14.5px}
  .room .mini{height:30px}
  .pill{font-size:11px;padding:2px 8px}
  .filters{width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .filters button{flex-shrink:0}
  .bar-in{min-height:62px;gap:10px}
  .back span{display:none}
  .back{padding:0 10px}
  .bar .acts,.bar .ring{display:none}
  .room-intro{padding:18px 0 14px}
  .board{grid-template-columns:1fr;border-radius:20px;margin-bottom:140px}
  .cell.a-cost{grid-column:auto}
  .cell{padding:16px 14px}
  .pager{margin:-124px 0 120px}
  .mbar{display:flex;gap:8px;position:fixed;inset-inline:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
  .mbar .btn{flex:1;height:50px;font-size:16px}
  .mbar .btn-line,.mbar .btn-pdf{flex:0 0 auto;padding:0 16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .done-banner{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="t-ic" id="tIc"></span><div><b id="tT"></b><small id="tS"></small></div></div>

<div class="dlg-bg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg">
    <h2 id="dlgT">لم تحفظوا تعديلاتكم بعد</h2>
    <p>احفظوها الآن حتى يراها بقية الفريق.</p>
    <div class="dlg-acts">
      <button class="btn btn-go" id="dSave">حفظ والمتابعة</button>
      <button class="btn btn-line" id="dStay">متابعة التعديل</button>
      <button class="btn btn-line" id="dDrop" style="color:var(--coral-ink)">الخروج دون حفظ</button>
    </div>
  </div>
</div>

<div class="dlg-bg celebrate" id="cel" role="dialog" aria-modal="true" aria-labelledby="celT">
  <div class="dlg">
    <div class="medal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/></svg></div>
    <h2 id="celT">اكتمل نموذج عملكم</h2>
    <p>أنجزتم العناصر التسعة كلها. حمّلوا نسخة PDF لعرضها أو مشاركتها.</p>
    <div id="celMini"></div>
    <div class="dlg-acts">
      <button class="btn btn-ink" id="celPdf"></button>
      <button class="btn btn-line" id="celClose">متابعة</button>
    </div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ===== إعدادات قاعدة البيانات (Supabase) ===== */
const SUPABASE_URL = "https://vsaybplhzovkotibwhvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_t1vZHZZOqO0GdVntYeKIFw_KrScpXzo"; // مفتاح عام مخصص للمتصفح
const TABLE = "bmc_projects";
const COUNT = 20;

/* ===== Canvas definition ===== */
const BLOCKS = [
  {key:"key_partners",          a:"kp",   h:"indigo", o:8, ar:"الشراكات الرئيسية",   short:"الشراكات",  en:"Key Partners",           q:"من شركاؤك ومورّدوك الأساسيون؟ وماذا يقدمون لمشروعك؟", ex:["محمصة بن محلية","عمادة شؤون الطلاب"]},
  {key:"key_activities",        a:"ka",   h:"indigo", o:7, ar:"الأنشطة الرئيسية",    short:"الأنشطة",   en:"Key Activities",         q:"ما أهم الأعمال التي تقوم بها لتقديم القيمة المقترحة؟", ex:["تحضير القهوة وخدمة الطلاب","شراء البن وإدارة المخزون"]},
  {key:"key_resources",         a:"kr",   h:"indigo", o:6, ar:"الموارد الرئيسية",    short:"الموارد",   en:"Key Resources",          q:"ما الأصول التي يحتاجها المشروع: بشرية، مادية، مالية، فكرية؟", ex:["عربة القهوة والمعدات","باريستا مدرّب"]},
  {key:"value_propositions",    a:"vp",   h:"pink",   o:2, ar:"القيم المقترحة",      short:"القيمة",    en:"Value Proposition",      q:"ما المشكلة التي تحلها؟ ولماذا يختارك العميل؟", ex:["قهوة مختصة بسعر يناسب الطلاب","اطلب مسبقًا واستلم بدون انتظار"]},
  {key:"customer_relationships",a:"cr",   h:"amber",  o:4, ar:"العلاقات مع العملاء", short:"العلاقات",  en:"Customer Relationships", q:"كيف تكسب العملاء وتحافظ عليهم؟", ex:["بطاقة ولاء: الكوب العاشر مجانًا"]},
  {key:"channels",              a:"ch",   h:"amber",  o:3, ar:"القنوات",             short:"القنوات",   en:"Channels",               q:"كيف تصل إلى عملائك وتوصل لهم القيمة؟", ex:["عربة عند المباني الرئيسية","الطلب عبر واتساب وإنستغرام"]},
  {key:"customer_segments",     a:"cs",   h:"amber",  o:1, ar:"شرائح العملاء",       short:"العملاء",   en:"Customer Segments",      q:"لمن تصنع القيمة؟ ومن أهم عملائك؟", ex:["طلاب وطالبات الجامعة","أعضاء هيئة التدريس"]},
  {key:"cost_structure",        a:"cost", h:"coral",  o:9, ar:"هيكل التكاليف",       short:"التكاليف",  en:"Cost Structure",         q:"ما أهم التكاليف الثابتة والمتغيرة؟", ex:["البن والحليب والأكواب","رواتب الباريستا","صيانة العربة"]},
  {key:"revenue_streams",       a:"rev",  h:"teal",   o:5, ar:"مصادر الإيرادات",     short:"الإيرادات", en:"Revenue Streams",        q:"مقابل ماذا يدفع العملاء؟ وكيف يدفعون؟", ex:["بيع المشروبات","اشتراك أسبوعي للطلاب"]},
];
const BY_ORDER = [...BLOCKS].sort((a,b)=>a.o-b.o);
const KEYS = BLOCKS.map(b=>b.key);
const HUES = ["indigo","pink","amber","teal","coral"];
const hueFor = id => HUES[(id-1)%HUES.length];
const EX_PROJECT = "عربة قهوة داخل الحرم الجامعي";

const IC = {
  kp:'<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
  ka:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  kr:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  vp:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  cr:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  ch:'<path d="M1 4h14v12H1z"/><path d="M15 8h4l4 4v4h-8V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  cs:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  cost:'<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
  rev:'<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.3 18"/><path d="M7 6h1v4"/>',
  check:'<path d="M20 6L9 17l-5-5"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  next:'<path d="M15 18l-6-6 6-6"/>', prev:'<path d="M9 18l6-6-6-6"/>', alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  pdf:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15l3 3 3-3"/>',
  bulb:'<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ===== Helpers ===== */
const $ = (s,el=document)=>el.querySelector(s);
const app = $("#app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toNotes = t => String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);
const toText = arr => arr.map(s=>s.replace(/\s*\n\s*/g," ").trim()).filter(Boolean).join("\n");
const blank = id => ({id, project_name:"", updated_at:null, ...Object.fromEntries(KEYS.map(k=>[k,""]))});
const filled = p => BLOCKS.filter(b=>toNotes(p[b.key]).length).length;
const started = p => filled(p)>0 || !!p.project_name.trim();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function ago(iso){
  if(!iso) return "لم يُحفظ بعد";
  const s=(Date.now()-new Date(iso))/1000;
  if(s<45) return "حُفظ الآن";
  if(s<3600) return `حُفظ قبل ${Math.max(1,Math.floor(s/60))} د`;
  if(s<86400) return `حُفظ قبل ${Math.floor(s/3600)} س`;
  return "حُفظ " + new Date(iso).toLocaleDateString("ar-SA-u-nu-latn-ca-gregory",{day:"numeric",month:"long"});
}
function miniHTML(p, cls=""){
  return `<div class="mini ${cls}" aria-hidden="true">${BLOCKS.map(b=>`<i class="a-${b.a} h-${b.h} ${p && toNotes(p[b.key]).length?"on":""}"></i>`).join("")}</div>`;
}
function ringHTML(n){
  const C=2*Math.PI*18, off=C*(1-n/9);
  return `<div class="ring" title="${n} من 9 عناصر"><svg viewBox="0 0 46 46"><circle class="track" cx="23" cy="23" r="18"/><circle class="val" cx="23" cy="23" r="18" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${n}/9</b></div>`;
}

/* ===== API ===== */
async function api(path, opt={}){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {...opt, headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...(opt.headers||{})}});
  if(!r.ok) throw new Error(`${r.status} ${await r.text().catch(()=> "")}`);
  return r.status===204?null:r.json();
}
const getAll = () => api(`${TABLE}?select=*&order=id.asc`);
const getOne = async id => (await api(`${TABLE}?select=*&id=eq.${id}`))[0];
async function putIf(id, data, since){ // only writes if nobody saved since `since`
  const guard = since ? `updated_at=eq.${encodeURIComponent(since)}` : "updated_at=is.null";
  const rows = await api(`${TABLE}?id=eq.${id}&${guard}`, {method:"PATCH", headers:{Prefer:"return=representation"}, body:JSON.stringify(data)});
  return rows && rows.length ? rows[0] : null;
}
function mergeNotes(base, mine, theirs){ // keep teammates' notes; apply my additions & removals
  const take=(arr,v)=>{const i=arr.indexOf(v); if(i>-1){arr.splice(i,1);return true;} return false;};
  const left=[...mine], removed=[];
  base.forEach(v=>{ if(!take(left,v)) removed.push(v); });
  const out=[...theirs]; removed.forEach(v=>take(out,v));
  left.forEach(v=>{ if(!out.includes(v)) out.push(v); });
  return out;
}

/* ===== State ===== */
const S = {rows:new Map(), loaded:false, online:null, room:null, hints:true, filter:"all", pending:undefined, skipHash:false, heroPlayed:false};
try{ S.hints = localStorage.getItem("bmc-hints")!=="off"; }catch(e){}
const draftKey=id=>`bmc3-draft-${id}`;
const saveLocal=()=>{ try{ const r=S.room; localStorage.setItem(draftKey(r.id), JSON.stringify({base:r.base, draft:r.draft})); }catch(e){} };
const loadLocal=id=>{ try{ return JSON.parse(localStorage.getItem(draftKey(id))||"null"); }catch(e){ return null; } };
const dropLocal=id=>{ try{ localStorage.removeItem(draftKey(id)); }catch(e){} };
function setOnline(ok){ S.online=ok; const l=$(".live"); if(l){ l.className="live "+(ok?"ok":"err"); l.lastElementChild.textContent=ok?"متصل":"غير متصل"; } }

let tt;
function toast(t, s="", kind="ok", ms=4000){
  const el=$("#toast"); el.className="toast "+(kind==="err"?"err":kind==="busy"?"busy":"");
  $("#tIc").innerHTML = kind==="busy" ? '<span class="spin" style="color:#fff"></span>' : svg(kind==="err"?"alert":"check");
  $("#tT").textContent=t; $("#tS").textContent=s;
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(tt); if(ms) tt=setTimeout(()=>el.classList.remove("show"), ms);
}

/* ===== Home ===== */
function topbar(){
  return `<header class="top">

/* ===== Room ===== */
const draftFrom = row => ({project_name:row.project_name||"", notes:Object.fromEntries(KEYS.map(k=>[k,toNotes(row[k])]))});
function draftAsRow(){ const d=S.room.draft; return {project_name:d.project_name.trim(), ...Object.fromEntries(KEYS.map(k=>[k,toText(d.notes[k])]))}; }
const liveRow = () => ({...S.room.base, ...draftAsRow()});

async function openRoom(id){
  const row = S.rows.get(id)||blank(id);
  S.room = {id, base:row, draft:draftFrom(row), editing:false, dirty:false, saving:false, pdfBusy:false, exOpen:new Set()};
  renderRoom(); window.scrollTo(0,0);
  try{
    const fresh = await getOne(id); setOnline(true);
    if(!S.room || S.room.id!==id) return;
    S.rows.set(id,fresh);
    const local = loadLocal(id);
    if(local && JSON.stringify(local.draft)!==JSON.stringify(draftFrom(local.base))){
      Object.assign(S.room,{base:local.base, draft:local.draft, editing:true, dirty:true});
      renderRoom(); toast("استرجعنا تعديلاتكم غير المحفوظة","اضغطوا «حفظ» لإرسالها للفريق");
    } else {
      dropLocal(id);
      Object.assign(S.room,{base:fresh, draft:draftFrom(fresh), editing:!started(fresh)});
      renderRoom();
    }
  }catch(e){ console.error(e); setOnline(false); toast("تعذّر تحميل آخر نسخة","تحقق من الاتصال بالإنترنت","err"); }
}

function actionsHTML(mobile=false){

  if(r.editing) return `<button class="btn btn-go" data-act="save" ${r.saving?"disabled":""}>${r.saving?'<span class="spin"></span> جارٍ الحفظ':svg("check")+" حفظ"}</button>
    <button class="btn btn-line" data-act="cancel" ${r.saving?"disabled":""}>إلغاء</button>`;
  return `<button class="btn btn-ink" data-act="edit">${svg("edit")} تعديل</button>
    <button class="btn btn-pdf" data-act="pdf" ${r.pdfBusy?"disabled":""} aria-label="تحميل PDF">${r.pdfBusy?'<span class="spin"></span>':svg("pdf")}${mobile?"PDF":" تحميل PDF"}</button>`;
}
function statusHTML(){
  const r=S.room;
  if(r.dirty) return `<span class="status dirty"><i></i>تعديلات غير محفوظة</span>`;
  if(r.editing) return `<span class="status editing"><i></i>وضع التعديل</span>`;
  return `<span class="status"><i></i>${ago(r.base.updated_at)}</span>`;
}
function navHTML(){

    body = notes.map((t,i)=>`<div class="note ed"><textarea rows="1" data-note="${b.key}" data-i="${i}" aria-label="فكرة في ${b.ar}">${esc(t)}</textarea><button class="rm" data-rm="${b.key}" data-i="${i}" aria-label="حذف الفكرة">${svg("x")}</button></div>`).join("")
      + `<div class="adder"><textarea rows="1" data-add="${b.key}" placeholder="أضف فكرة…" aria-label="أضف فكرة إلى ${b.ar}"></textarea><button data-addbtn="${b.key}" aria-label="إضافة الفكرة">${svg("plus")}</button></div>`;
  } else {
    body = notes.length ? notes.map(t=>`<div class="note">${esc(t)}</div>`).join("")

    <div class="notes" data-notes="${b.key}">${body}</div>

function grow(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }

function refreshChrome(){
  const r=S.room, n=filled(liveRow());
  const st=$(".bar-text .status"); if(st) st.outerHTML=statusHTML();
  const rg=$(".bar .ring"); if(rg) rg.outerHTML=ringHTML(n);
  const nv=$(".nav9"); if(nv) nv.innerHTML=navHTML();
  const name=r.draft.project_name.trim(); const s=$(".bar-text strong"); if(s) s.textContent=name||`المشروع ${r.id}`;
}
function rerenderCell(key, focusAdd=false, popLast=false){
  const b=BLOCKS.find(x=>x.key===key), el=$(`#cell-${b.a}`); if(!el) return;
  el.outerHTML=cellHTML(b);
  const nel=$(`#cell-${b.a}`); nel.querySelectorAll("textarea").forEach(grow);
  if(popLast){ const ns=nel.querySelectorAll(".note"); ns[ns.length-1]?.classList.add("pop"); }
  if(focusAdd) nel.querySelector("[data-add]")?.focus({preventScroll:false});
}
function touch(){ S.room.dirty=true; saveLocal(); refreshChrome(); }
function addNote(key){
  const ta=$(`[data-add="${key}"]`); const v=(ta?.value||"").replace(/\s*\n\s*/g," ").trim(); if(!v) return;
  S.room.draft.notes[key].push(v); rerenderCell(key,true,true); touch();
}
function startEditing(focusKey){
  const r=S.room; r.editing=true; renderRoom();
  if(focusKey){ const b=BLOCKS.find(x=>x.key===focusKey); $(`#cell-${b.a}`).scrollIntoView({block:"center"}); setTimeout(()=>$(`[data-add="${focusKey}"]`)?.focus({preventScroll:true}),50); }
  else if(!r.draft.project_name) $("#pname").focus();
}

async function save(){
  const r=S.room; if(!r||r.saving) return false;
  app.querySelectorAll("[data-add]").forEach(t=>{ const v=t.value.trim(); if(v) r.draft.notes[t.dataset.add].push(v.replace(/\s*\n\s*/g," ")); });
  const wasDone = filled(r.base)===9;
  r.saving=true; renderRoom();
  const mine=draftAsRow(); let base=r.base, merged=false;
  try{
    for(let i=0;i<4;i++){
      const row=await putIf(r.id, mine, base.updated_at);
      if(row){
        S.rows.set(r.id,row); Object.assign(r,{base:row, draft:draftFrom(row), editing:false, dirty:false, saving:false});
        dropLocal(r.id); setOnline(true); renderRoom();
        if(filled(row)===9 && !wasDone) celebrate();
        else toast(`تم حفظ المشروع ${r.id}`, merged?"ودُمجت أفكاركم مع ما أضافه زملاؤكم":"يرى كل أعضاء الفريق التعديلات الآن");
        return true;
      }
      const theirs=await getOne(r.id);
      for(const k of KEYS) mine[k]=toText(mergeNotes(toNotes(base[k]),toNotes(mine[k]),toNotes(theirs[k])));
      if(mine.project_name===(base.project_name||"")) mine.project_name=theirs.project_name;
      base=theirs; merged=true;
    }
    throw new Error("conflict");
  }catch(e){
    console.error(e); r.saving=false; renderRoom(); setOnline(false);
    toast("لم يتم الحفظ","تحقق من الاتصال ثم اضغط «حفظ» مرة أخرى. تعديلاتكم محفوظة على هذا الجهاز.","err",6000);
    return false;
  }
}

function celebrate(){

  $("#celMini .mini").querySelectorAll("i").forEach(i=>i.classList.add("on"));
  $("#celPdf").innerHTML = svg("pdf")+" تحميل PDF";

  if(!reduced) confetti();
}
function confetti(){
  const cv=$("#confetti"), ctx=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols=["#5B6CFF","#EC4F8C","#F4A42A","#14B39A","#F2665B"];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-5,
    w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){
    const el=t-t0; ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-el/2600); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(el<2600) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}
$("#celClose").onclick=()=>$("#cel").classList.remove("open");
$("#celPdf").onclick=()=>{ $("#cel").classList.remove("open"); downloadPDF(); };

const loaded={};
const loadScript=src=>loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error("load "+src));};document.head.appendChild(s);}));

function buildSheet(row){
  const name=row.project_name.trim(), n=filled(row);
  const date=new Date().toLocaleDateString("ar-SA-u-nu-latn-ca-gregory",{day:"numeric",month:"long",year:"numeric"});
  const el=document.createElement("div"); el.className="sheet"; el.setAttribute("aria-hidden","true");
  el.innerHTML=`
    <div class="sh-head">
      <div>
        <div class="sh-kicker">${miniLogo()}<span>نموذج العمل التجاري</span></div>
        <h1 class="sh-title">${name?esc(name):`المشروع ${row.id}`}</h1>
      </div>
      <div class="sh-meta"><span class="sh-no">المشروع ${row.id}</span><span class="sh-date">${date}</span></div>
    </div>
    <div class="sh-board">
      ${BLOCKS.map(b=>{const ns=toNotes(row[b.key]); return `<div class="sh-cell a-${b.a} h-${b.h} ${b.a==="cost"||b.a==="rev"?"wide":""}">
        <div class="sh-ch"><span class="sh-ic">${svg(b.a)}</span><div><h3>${b.ar}</h3><small>${b.en}</small></div></div>
        <div class="sh-notes">${ns.length?ns.map(t=>`<div class="sh-note">${esc(t)}</div>`).join(""):`<span class="sh-empty">—</span>`}</div>
      </div>`;}).join("")}
    </div>
    <div class="sh-foot"><span>ورشة نموذج العمل التجاري</span><span><b>${n}</b> من 9 عناصر مكتملة</span></div>`;
  return el;
}
function fitSheet(el){
  const overflow=()=>[...el.querySelectorAll(".sh-notes")].some(x=>x.scrollHeight>x.clientHeight+1);
  for(const fs of [17,16,15,14,13,12,11,10,9]){ el.style.setProperty("--fs",fs+"px"); if(!overflow()) return true; }
  return false;
}
async function downloadPDF(){
  const r=S.room; if(!r||r.pdfBusy) return;
  if(r.dirty){ toast("احفظوا التعديلات أولًا","ملف PDF يُنشأ من آخر نسخة محفوظة","err"); return; }
  r.pdfBusy=true; refreshPdfButtons();
  toast("جارٍ تجهيز ملف PDF","لحظات قليلة…","busy",0);
  let sheet;
  try{
    await Promise.all([loadScript("assets/vendor/html2canvas.min.js"), loadScript("assets/vendor/jspdf.umd.min.js")]);
    const row=S.rows.get(r.id)||r.base;
    sheet=buildSheet(row); document.body.appendChild(sheet);
    if(document.fonts?.ready) await document.fonts.ready;
    fitSheet(sheet);
    const scale = innerWidth<720 ? 1.25 : 1.6;
    const canvas = await html2canvas(sheet,{scale, backgroundColor:"#ffffff", logging:false, x:0, y:0, scrollX:0, scrollY:0, windowWidth:1754, windowHeight:1240,
      onclone:(doc)=>{ const s=doc.querySelector(".sheet"); s.style.left="0"; }});
    const pdf = new jspdf.jsPDF({orientation:"landscape", unit:"mm", format:"a4", compress:true});
    pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,297,210,undefined,"FAST");
    pdf.setProperties({title:`Business Model Canvas – Project ${r.id}`});
    pdf.save(`Business-Model-Canvas-Project-${r.id}.pdf`);
    toast("تم تحميل ملف PDF",`نموذج عمل المشروع ${r.id}`);
  }catch(e){
    console.error(e); toast("تعذّر إنشاء ملف PDF","تحقق من الاتصال ثم حاولوا مرة أخرى","err");
  }finally{
    sheet?.remove(); if(S.room===r){ r.pdfBusy=false; refreshPdfButtons(); }
  }
}
function refreshPdfButtons(){ if(!S.room||S.room.editing) return; const a=$(".bar .acts"); if(a) a.innerHTML=actionsHTML(); const m=$(".mbar"); if(m) m.innerHTML=actionsHTML(true); }

/* ===== Live refresh from teammates ===== */
setInterval(async()=>{
  if(document.hidden) return;
  try{
    if(S.room && !S.room.editing && !S.room.saving && !S.room.pdfBusy){
      const fresh=await getOne(S.room.id); setOnline(true);
      if(S.room && !S.room.editing && fresh.updated_at!==S.room.base.updated_at){
        S.rows.set(fresh.id,fresh); S.room.base=fresh; S.room.draft=draftFrom(fresh);
        const y=scrollY; renderRoom(); scrollTo(0,y);
        toast("وصلت تحديثات من الفريق","تم تحميل آخر نسخة محفوظة");
      }
    } else if(!S.room){
      const rows=await getAll(); rows.forEach(x=>S.rows.set(x.id,x)); setOnline(true);
      if(!S.room){ const y=scrollY; renderHome(); scrollTo(0,y); }
    }
  }catch(e){ setOnline(false); }
},12000);

/* ===== Routing ===== */
const hashId=()=>{ const m=location.hash.match(/^#project-(\d{1,2})$/); const n=m?+m[1]:0; return n>=1&&n<=COUNT?n:null; };
function route(){ const id=hashId(); if(id) openRoom(id); else { S.room=null; renderHome(); scrollTo(0,0); } }
function go(id){
  if(S.room && S.room.dirty){ S.pending=id; openDlg(); return; }
  const h=id?`#project-${id}`:"";
  if((location.hash||"")===h){ route(); return; }
  if(id) location.hash=`project-${id}`; else { history.pushState(null,"",location.pathname+location.search); route(); }
}
addEventListener("hashchange",()=>{
  if(S.skipHash){ S.skipHash=false; return; }
  const id=hashId();
  if(S.room && S.room.dirty && id!==S.room.id){ S.pending=id; S.skipHash=true; location.hash=`project-${S.room.id}`; openDlg(); return; }
  if(S.room && id===S.room.id) return;
  route();
});
addEventListener("popstate",()=>{ if(!location.hash && S.room && !S.room.dirty){ S.room=null; renderHome(); } });
addEventListener("beforeunload",e=>{ if(S.room&&S.room.dirty){ e.preventDefault(); e.returnValue=""; } });

function openDlg(){ $("#dlg").classList.add("open"); $("#dSave").focus(); }
function closeDlg(){ $("#dlg").classList.remove("open"); }
function proceed(){ const id=S.pending; S.pending=undefined; go(id); }
$("#dSave").onclick=async()=>{ closeDlg(); if(await save()) proceed(); };
$("#dStay").onclick=()=>{ closeDlg(); S.pending=undefined; };
$("#dDrop").onclick=()=>{ closeDlg(); dropLocal(S.room.id); S.room.dirty=false; proceed(); };
$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") $("#dStay").click(); });
$("#cel").addEventListener("click",e=>{ if(e.target.id==="cel") $("#celClose").click(); });

/* ===== Events ===== */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-home]")){ e.preventDefault(); go(null); return; }
  const f=e.target.closest("[data-filter]"); if(f){ S.filter=f.dataset.filter; renderHome(); return; }
  const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  const j=e.target.closest("[data-jump]");
  if(j){ const c=$(`#cell-${j.dataset.jump}`); c.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); return; }
  const st=e.target.closest("[data-start]"); if(st){ startEditing(st.dataset.start); return; }
  const ex=e.target.closest("[data-ex]");
  if(ex){ const k=ex.dataset.ex, set=S.room.exOpen; set.has(k)?set.delete(k):set.add(k); const c=ex.closest(".cell"); c.classList.toggle("show-ex",set.has(k)); ex.setAttribute("aria-expanded",set.has(k)); ex.innerHTML=svg("bulb")+(set.has(k)?"إخفاء المثال":"شاهد مثالًا"); return; }
  const rm=e.target.closest("[data-rm]");
  if(rm){ S.room.draft.notes[rm.dataset.rm].splice(+rm.dataset.i,1); rerenderCell(rm.dataset.rm); touch(); return; }
  const ab=e.target.closest("[data-addbtn]"); if(ab){ addNote(ab.dataset.addbtn); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, r=S.room;
  if(act==="edit") startEditing();
  else if(act==="save") save();
  else if(act==="pdf") downloadPDF();
  else if(act==="cancel"){ dropLocal(r.id); r.base=S.rows.get(r.id)||r.base; Object.assign(r,{draft:draftFrom(r.base),editing:false,dirty:false}); renderRoom(); }
  else if(act==="hints"){ S.hints=!S.hints; try{localStorage.setItem("bmc-hints",S.hints?"on":"off")}catch(_){} $(".board").classList.toggle("hints-off",!S.hints); a.setAttribute("aria-pressed",S.hints); }
});
document.addEventListener("input",e=>{
  const t=e.target, r=S.room; if(!r||!r.editing) return;
  if(t.id==="pname"){ r.draft.project_name=t.value; touch(); return; }
  if(t.dataset.note){ r.draft.notes[t.dataset.note][+t.dataset.i]=t.value.replace(/\n/g," "); grow(t); touch(); return; }
  if(t.dataset.add!==undefined) grow(t);
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter" && !e.shiftKey && t.dataset?.add!==undefined && !e.isComposing){ e.preventDefault(); addNote(t.dataset.add); }
  else if(e.key==="Enter" && t.dataset?.note && !e.isComposing){ e.preventDefault(); $(`[data-add="${t.dataset.note}"]`)?.focus(); }
  else if(e.key==="Enter" && t.id==="pname"){ e.preventDefault(); $('[data-add="customer_segments"]')?.focus(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s" && S.room?.editing){ e.preventDefault(); save(); }
  if(e.key==="Escape"){ if($("#dlg").classList.contains("open")) $("#dStay").click(); if($("#cel").classList.contains("open")) $("#celClose").click(); }
});
document.addEventListener("focusout",e=>{
  const t=e.target; if(!S.room?.editing || !t.dataset?.note) return;
  if(!t.value.trim()){ const k=t.dataset.note; S.room.draft.notes[k].splice(+t.dataset.i,1); setTimeout(()=>rerenderCell(k),0); touch(); }
});

/* ===== Boot ===== */
(async()=>{
  route();
  try{ const rows=await getAll(); rows.forEach(x=>S.rows.set(x.id,x)); S.loaded=true; setOnline(true); }
  catch(e){ console.error(e); S.loaded=true; setOnline(false); }
  if(!S.room) renderHome();
})();
</script>
</body>
</html>
